<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wits CPS | Change Password</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="login-page">
  <main class="login-container">
    <header class="login-header">
      <img src="../assets/images/wits-logo.jpg" alt="Wits University Logo" class="wits-logo" />
      <h1>Campus Protection Services</h1>
      <p>Choose your own password</p>
    </header>
    <section class="login-card">
      <h2>Change Password</h2>
      <p style="font-size:13px;color:#666;margin-bottom:14px;">You signed in with a temporary password. Choose one only you know before continuing.</p>
      <form onsubmit="handleChangePassword(event)">
        <div class="form-group"><label for="cpCurrent">Temporary / current password</label><input id="cpCurrent" type="password" required /></div>
        <div class="form-group"><label for="cpNew">New password</label><input id="cpNew" type="password" required minlength="8" placeholder="At least 8 characters" /></div>
        <div class="form-group"><label for="cpNew2">Repeat new password</label><input id="cpNew2" type="password" required minlength="8" /></div>
        <p class="error-message" id="cpError"></p>
        <button type="submit" class="btn-primary">Save and Continue</button>
        <a href="#" class="forgot-password" onclick="logout();return false;">Sign out</a>
      </form>
    </section>
  </main>
  <script src="../assets/js/main.js"></script>
  <script>if (!getToken()) window.location.href = '../index.html';</script>
</body>
</html>
