<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wits CPS | Equipment</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="dashboard-page">
  <nav class="navbar">
    <section class="navbar-left">
      <img src="../assets/images/wits-logo.jpg" alt="Wits Logo" class="nav-logo" />
      <span class="nav-title">CPS Call Logging System</span>
    </section>
    <section class="navbar-right">
      <span class="nav-user">Welcome</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </section>
  </nav>
  <section class="page-layout">
    <aside class="sidebar"><nav class="sidebar-nav"></nav></aside>
    <main class="main-content">

      <header class="page-header"><h1>Equipment Register</h1><p>Serial numbers, criticality and the repair history of every piece of CPS equipment</p></header>
      <p class="success-message" id="successMessage"></p>
      <section class="filter-card">
        <section class="form-row">
          <div class="form-group"><label for="assetSearch">Search</label><input type="text" id="assetSearch" placeholder="Tag, serial number or name" oninput="loadAssets()" /></div>
          <div class="form-group"><label for="assetStatus">Status</label>
            <select id="assetStatus" onchange="loadAssets()"><option value="all">All</option><option value="in_service">In service</option><option value="removed">Removed</option><option value="in_repair">In repair</option><option value="decommissioned">Decommissioned</option></select></div>
          <div class="form-group" id="addAssetWrap" style="display:none;align-self:end;"><button class="btn-primary" onclick="openAddAsset()">+ Add Equipment</button></div>
        </section>
      </section>
      <section class="table-section">
        <header class="table-header"><h2>Equipment</h2><span class="badge-count" id="assetCount">Loading…</span></header>
        <table class="tickets-table"><thead><tr><th>Tag</th><th>Name</th><th>Serial No.</th><th>Location</th><th>Criticality</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="assetBody"><tr><td colspan="7" style="text-align:center;padding:20px;color:#999;">Loading…</td></tr></tbody></table>
      </section>
    </main>
  </section>

  <dialog id="assetModal" class="modal"><section class="modal-content" id="assetModalBody"></section></dialog>
  <dialog id="addAssetModal" class="modal"><section class="modal-content">
    <header class="modal-header"><h2>Add Equipment</h2><button class="modal-close" onclick="document.getElementById('addAssetModal').close()">✕</button></header>
    <form id="addAssetForm" onsubmit="handleAddAsset(event)">
      <div class="form-row"><div class="form-group"><label>Asset tag <span class="required">*</span></label><input id="aTag" placeholder="e.g. CPS-BOOM-002" /></div>
        <div class="form-group"><label>Serial number</label><input id="aSerial" /></div></div>
      <div class="form-group"><label>Name <span class="required">*</span></label><input id="aName" placeholder="e.g. Yale North entrance boom gate" /></div>
      <div class="form-row"><div class="form-group"><label>Type</label><select id="aType"><option value="boom_gate">Boom gate</option><option value="turnstile">Turnstile</option><option value="reader">Reader</option><option value="camera">Camera</option><option value="door_controller">Door controller</option><option value="alarm_panel">Alarm panel</option><option value="other">Other</option></select></div>
        <div class="form-group"><label>Criticality</label><select id="aCrit"><option value="critical">Critical (2 h SLA)</option><option value="high">High (4 h)</option><option value="medium" selected>Medium (8 h)</option><option value="low">Low (24 h)</option></select></div></div>
      <div class="form-row"><div class="form-group"><label>Location</label><select id="aLoc"><option value="">—</option></select></div>
        <div class="form-group"><label>Supplier</label><input id="aSupplier" /></div></div>
      <p id="addAssetError" style="color:red;font-size:13px;min-height:18px;"></p>
      <section class="form-actions"><button type="button" class="btn-secondary" onclick="document.getElementById('addAssetModal').close()">Cancel</button><button type="submit" class="btn-primary">Add Equipment</button></section>
    </form></section></dialog>
  <script src="../assets/js/main.js"></script>
  <script>checkAccess();</script>
  <script>

    const me = getUser(); const isAdmin = me && me.role === 'admin';
    const STATUS_LABEL = { in_service:'In service', removed:'Removed', in_repair:'In repair', decommissioned:'Decommissioned' };
    const CRIT_CLASS = { critical:'critical', high:'high', medium:'medium', low:'low' };
    let currentAsset = null;
    function toast(msg){ const ok=getSuccessEl(); ok.textContent=msg; ok.style.display='block'; setTimeout(()=>{ ok.style.display='none'; },8000); }
    async function loadAssets() {
      try {
        const q = document.getElementById('assetSearch').value.trim(), st = document.getElementById('assetStatus').value;
        const d = await apiFetch(`/assets?status=${encodeURIComponent(st)}&q=${encodeURIComponent(q)}`);
        const list = d.assets || [];
        document.getElementById('assetCount').textContent = `${list.length} items`;
        document.getElementById('assetBody').innerHTML = list.length ? list.map(a => `<tr>
          <td><strong>${esc(a.asset_tag)}</strong></td><td>${esc(a.name)}</td><td>${esc(a.serial_number||'—')}</td>
          <td>${esc(a.locations?.location_name||'—')}</td>
          <td><span class="badge ${CRIT_CLASS[a.criticality]||''}">${esc(a.criticality)}</span></td>
          <td><span class="badge ${a.status==='in_service'?'low':a.status==='decommissioned'?'cancelled':'high'}">${esc(STATUS_LABEL[a.status]||a.status)}</span></td>
          <td><button class="btn-assign" onclick="openAsset(${a.asset_id})">View / Update</button></td></tr>`).join('')
          : '<tr><td colspan="7" style="text-align:center;padding:20px;color:#999;">No equipment found.</td></tr>';
      } catch(e) { console.error(e); }
    }
    window.pageRefresh = loadAssets;
    async function openAsset(id) {
      const d = await apiFetch(`/assets/${id}`); currentAsset = d.asset; const a = d.asset;
      const mv = d.movements.map(m => `<li><strong>${esc(m.action.replace('_',' '))}</strong> — ${esc(m.notes||'')} <small>${esc(m.performer?.full_name||'')} · ${esc(formatDateTime(m.performed_at))}${m.expected_return?` · expected back ${esc(m.expected_return)}`:''}</small></li>`).join('') || '<li style="color:#94a3b8;">No movements recorded.</li>';
      const tk = d.tickets.map(t => `<li><a href="track-incident.html?ticket=${encodeURIComponent(t.ticket_number)}">${esc(t.ticket_number)}</a> · ${esc(t.status.replace('_',' '))} · ${esc(t.priority)} — ${esc(t.description.substring(0,70))}</li>`).join('') || '<li style="color:#94a3b8;">No tickets raised against this equipment.</li>';
      const sc = d.schedules.map(s => `<li>${esc(s.title)} — every ${s.interval_days} days, next due ${esc(s.next_due)}${s.is_active?'':' (off)'}</li>`).join('') || '<li style="color:#94a3b8;">No maintenance schedules.</li>';
      const canMove = a.status !== 'decommissioned';
      document.getElementById('assetModalBody').innerHTML = `
        <header class="modal-header"><h2>${esc(a.asset_tag)}</h2><button class="modal-close" onclick="document.getElementById('assetModal').close()">✕</button></header>
        <section class="modal-ticket-info"><p><strong>${esc(a.name)}</strong></p>
          <p>Serial: ${esc(a.serial_number||'—')} · ${esc(a.locations?.location_name||'—')} · ${esc(STATUS_LABEL[a.status]||a.status)} · Supplier: ${esc(a.supplier||'—')}</p>
          <p>Criticality: ${isAdmin ? `<select id="critEdit" onchange="saveCrit(${a.asset_id})">${['critical','high','medium','low'].map(c=>`<option ${c===a.criticality?'selected':''}>${c}</option>`).join('')}</select>` : `<strong>${esc(a.criticality)}</strong>`} <small>(sets the SLA for tickets raised on this equipment)</small></p></section>
        ${canMove ? `<h3 style="margin:10px 0 6px;">Record removal / repair / return</h3>
        <form id="moveForm" onsubmit="handleMove(event)">
          <div class="form-row"><div class="form-group"><label>Action</label><select id="mvAction" onchange="document.getElementById('mvSerialWrap').style.display=this.value==='replaced'?'block':'none'"><option value="removed">Removed from service</option><option value="sent_for_repair">Sent for repair</option><option value="returned">Returned to service</option><option value="replaced">Replaced with new unit</option></select></div>
            <div class="form-group"><label>Ticket ${isAdmin?'(optional)':'<span class="required">*</span>'}</label><input id="mvTicket" placeholder="CLS-2026-001" /></div></div>
          <div class="form-group" id="mvSerialWrap" style="display:none;"><label>New unit serial number <span class="required">*</span></label><input id="mvSerial" /></div>
          <div class="form-row"><div class="form-group"><label>Notes <span class="required">*</span></label><input id="mvNotes" placeholder="What happened?" /></div>
            <div class="form-group"><label>Expected back</label><input type="date" id="mvReturn" /></div></div>
          <p id="mvError" style="color:red;font-size:13px;min-height:18px;"></p>
          <section class="form-actions"><button type="submit" class="btn-primary">Record</button></section></form>` : ''}
        <section class="assign-context" style="display:block;"><details open><summary>Movement history</summary><ul>${mv}</ul></details>
          <details><summary>Tickets (${d.tickets.length})</summary><ul>${tk}</ul></details>
          <details><summary>Maintenance schedules</summary><ul>${sc}</ul></details></section>`;
      document.getElementById('assetModal').showModal();
    }
    async function handleMove(e) {
      e.preventDefault(); const err = document.getElementById('mvError'); err.textContent='';
      const body = { action: mvAction.value, notes: mvNotes.value.trim(), ticketNumber: mvTicket.value.trim() || undefined, expectedReturn: mvReturn.value || undefined, newSerial: mvSerial.value.trim() || undefined };
      if (body.notes.length < 5) { err.textContent='Please add a note (min 5 characters).'; return; }
      try { const d = await apiFetch(`/assets/${currentAsset.asset_id}/movements`, { method:'POST', body: JSON.stringify(body) });
        document.getElementById('assetModal').close(); toast(d.message); loadAssets(); }
      catch(ex) { err.textContent = ex.message; }
    }
    async function saveCrit(id) {
      try { const d = await apiFetch(`/assets/${id}`, { method:'PATCH', body: JSON.stringify({ criticality: document.getElementById('critEdit').value }) }); toast(d.message); loadAssets(); }
      catch(ex) { alert(ex.message); }
    }
    async function openAddAsset() {
      const l = await apiFetch('/users/locations');
      document.getElementById('aLoc').innerHTML = '<option value="">—</option>' + (l.locations||[]).map(x=>`<option value="${esc(x.location_id)}">${esc(x.location_name)}</option>`).join('');
      document.getElementById('addAssetModal').showModal();
    }
    async function handleAddAsset(e) {
      e.preventDefault(); const err = document.getElementById('addAssetError'); err.textContent='';
      try { const d = await apiFetch('/assets', { method:'POST', body: JSON.stringify({ assetTag:aTag.value, serialNumber:aSerial.value, name:aName.value, assetType:aType.value, criticality:aCrit.value, locationId:aLoc.value||undefined, supplier:aSupplier.value }) });
        document.getElementById('addAssetModal').close(); document.getElementById('addAssetForm').reset(); toast(d.message); loadAssets(); }
      catch(ex) { err.textContent = ex.message; }
    }
    if (isAdmin) document.getElementById('addAssetWrap').style.display = 'block';
    loadAssets();
  </script>
</body>
</html>
